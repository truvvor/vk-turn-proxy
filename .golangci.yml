version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - misspell
    - revive
  settings:
    errcheck:
      # Type assertions return (T, bool), not (T, error); we already use
      # the `, _` pattern in lots of places to mean "treat missing as
      # zero value". check-blank=true conflates that with discarding an
      # actual error, so keep it off.
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - (net.PacketConn).WriteTo
        - (net.Conn).Write
        - encoding/json.MarshalIndent
        - (*github.com/pion/dtls/v3.Conn).SetDeadline
    govet:
      disable:
        - fieldalignment
      enable-all: true
    revive:
      rules:
        - name: blank-imports
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
    # v2 location for what used to live under issues.exclude-rules.
    rules:
      - linters:
          - errcheck
        source: "doRequest|packetPool\\.Get"

      # Vendored upstream: the entire root module is now the transport tree
      # taken from WINGS-N/vk-turn-proxy. Upstream lints with golangci-lint's
      # DEFAULTS and no config; revive and govet's enable-all extras are OUR
      # additions. Applying them here would mean editing every upstream file,
      # which permanently diverges the tree and re-conflicts on every merge
      # from upstream — the exact treadmill adopting their transport was
      # meant to end.
      #
      # The default linter set still runs on this code, so genuine defects
      # are still caught; only our stricter style/analysis additions are
      # scoped off. Our own code lives in captcha-service/, a separate Go
      # module that this config does not reach anyway.
      - linters:
          - revive
          - govet
        path: '^(client|server|internal|sessionproto|appcontrolpb|controlpb|provisioningpb|wbstream|tcputil|proto)/'
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
