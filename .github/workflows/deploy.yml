name: Deploy

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (branch, tag, or SHA) to deploy
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'tcputil/**'
      - 'go.mod'
      - 'go.sum'
      - 'deploy/vk-turn-proxy@.service'
      - 'deploy/udp.env.example'
      - 'deploy/vless.env.example'
      - 'scripts/bootstrap.sh'
      - 'scripts/install.sh'
      - 'scripts/deploy.sh'
      - '.github/workflows/deploy.yml'

concurrency:
  # Per-runner serialisation: re-pushing main shouldn't queue up
  # multiple deploys to the same host, but parallel deploys across
  # distinct runners are fine.
  group: deploy-${{ github.ref }}-${{ matrix.runner }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy (${{ matrix.runner }})
    # Roll vk-turn-proxy@udp/@vless to every cluster runner so WRAP
    # (and any future server-side change) lands everywhere. bootstrap.sh
    # detects WireGuard / Xray presence per-host and skips what isn't
    # there, so a runner without WG just gets no @udp unit enabled and
    # the verify step soft-skips it.
    strategy:
      fail-fast: false
      matrix:
        runner: [ionos-us, ubuntu, ukoverheat]
    runs-on: [self-hosted, linux, x64, "${{ matrix.runner }}"]
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Ensure HOME / GOCACHE are set
        # Self-hosted runners that aren't started under a login shell can
        # arrive here with an empty $HOME, which makes `go env` and
        # actions/setup-go's cache step blow up. Fall back to RUNNER_TEMP.
        shell: bash
        run: |
          if [ -z "${HOME:-}" ]; then
            echo "HOME=$RUNNER_TEMP" >> "$GITHUB_ENV"
            echo "Set HOME=$RUNNER_TEMP"
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.5'
          cache: true

      - name: Bootstrap host (idempotent)
        # First-time setup: detect WireGuard / Xray, write env files,
        # enable systemd units. After the initial run install.sh leaves
        # existing /etc/vk-turn-proxy/*.env files alone, so this becomes
        # a no-op on subsequent deploys.
        run: sudo -n bash ./scripts/bootstrap.sh

      - name: Inject WRAP_KEY into udp.env (if secret is set)
        # The wrap shared key lives in repo secrets as WRAP_KEY so it
        # never lands in the public repo / Actions logs. When it's set,
        # we rewrite EXTRA_ARGS in /etc/vk-turn-proxy/udp.env to include
        # `-wrap -wrap-key <KEY>` so vk-turn-proxy@udp comes up in WRAP
        # mode after the unit restart. Idempotent: regex-replaces the
        # whole EXTRA_ARGS line so re-runs converge on the latest key.
        # If the secret is unset / empty, this step is a no-op and the
        # server stays in legacy mode.
        env:
          WRAP_KEY: ${{ secrets.WRAP_KEY }}
        run: |
          set -e
          if [ -z "${WRAP_KEY}" ]; then
            echo "WRAP_KEY secret not set — leaving udp.env EXTRA_ARGS as is"
            exit 0
          fi
          if [ "${#WRAP_KEY}" -ne 64 ]; then
            echo "::error::WRAP_KEY must be exactly 64 hex chars (got ${#WRAP_KEY})"
            exit 1
          fi
          if ! [ -f /etc/vk-turn-proxy/udp.env ]; then
            echo "::warning::/etc/vk-turn-proxy/udp.env doesn't exist yet — bootstrap should have created it; skipping"
            exit 0
          fi
          # Mask the key so it never lands in the Actions log even on
          # accidental echo / set -x.
          echo "::add-mask::${WRAP_KEY}"
          sudo sed -i "s|^EXTRA_ARGS=.*$|EXTRA_ARGS=-wrap -wrap-key ${WRAP_KEY}|" /etc/vk-turn-proxy/udp.env
          # Confirm the line is there (without exposing the key).
          sudo grep -c '^EXTRA_ARGS=-wrap' /etc/vk-turn-proxy/udp.env || {
            echo "::error::EXTRA_ARGS=-wrap not present in udp.env after sed"
            exit 1
          }
          echo "udp.env EXTRA_ARGS updated to enable WRAP mode."

      - name: Build server binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags "-s -w -checklinkname=0" -trimpath \
            -o dist/server ./server
          ls -la dist/server

      - name: Deploy to host
        # Pass an empty second arg so deploy.sh skips the captcha-service
        # binary swap; cluster workflow owns that now.
        run: ./scripts/deploy.sh dist/server ""

      - name: Verify enabled instances are active
        id: verify
        run: |
          sleep 3
          fail=0
          found=0
          failed_units=""

          check_unit() {
            local unit="$1"
            if ! sudo systemctl is-enabled "$unit" >/dev/null 2>&1; then
              return
            fi
            found=$((found + 1))
            echo "::group::status $unit"
            sudo systemctl --no-pager --lines=30 status "$unit" || true
            echo "::endgroup::"
            if ! sudo systemctl is-active "$unit" >/dev/null 2>&1; then
              echo "::error::$unit is not active after deploy"
              failed_units="${failed_units} ${unit}"
              fail=1
            fi
          }

          for instance in udp vless; do
            check_unit "vk-turn-proxy@${instance}.service"
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::No enabled vk-turn-proxy@* unit found on this host."
            fail=1
          fi
          echo "failed_units=${failed_units# }" >> "$GITHUB_OUTPUT"
          exit "$fail"

      - name: Diagnostics on verify failure
        if: failure() && steps.verify.outputs.failed_units != ''
        run: |
          set +e
          for unit in ${{ steps.verify.outputs.failed_units }}; do
            case "$unit" in
              vk-turn-proxy@*.service)
                instance="${unit#vk-turn-proxy@}"; instance="${instance%.service}"
                env_file="/etc/vk-turn-proxy/${instance}.env"
                ;;
              captcha-service.service)
                env_file="/etc/vk-turn-proxy/captcha-service.env"
                ;;
              *)
                env_file=""
                ;;
            esac

            echo "::group::journalctl -u $unit (last 80 lines)"
            sudo journalctl -u "$unit" -n 80 --no-pager
            echo "::endgroup::"

            if [ -n "$env_file" ]; then
              echo "::group::env file: $env_file"
              # Mask API_KEY value so it doesn't end up in public Actions logs.
              sudo sed 's/^API_KEY=.*/API_KEY=<masked>/' "$env_file" 2>&1
              echo "::endgroup::"
            fi

            echo "::group::systemctl show $unit"
            sudo systemctl show "$unit" --no-pager \
                -p ActiveState,SubState,Result,ExecMainStatus,ExecMainCode,LoadState,UnitFileState,Restart
            echo "::endgroup::"
          done

          echo "::group::ss -ulnp / -tlnp (listeners)"
          sudo ss -ulnp
          sudo ss -tlnp
          echo "::endgroup::"

          echo "::group::ip link / wg interfaces"
          ip -br link
          sudo wg show 2>&1 || true
          echo "::endgroup::"

          echo "::group::/opt/vk-turn-proxy"
          sudo ls -la /opt/vk-turn-proxy/
          file /opt/vk-turn-proxy/server 2>&1 || true
          file /opt/vk-turn-proxy/captcha-service 2>&1 || true
          echo "::endgroup::"
          exit 1

      - name: Print connection URL
        if: success()
        env:
          MY_RUNNER: ${{ matrix.runner }}
        run: |
          PUBLIC_IP="$(curl -fsS --max-time 3 https://api.ipify.org 2>/dev/null || echo '<server-ip>')"
          {
            echo "## ${MY_RUNNER} — active vk-turn-proxy endpoints (\`${PUBLIC_IP}\`)"
            echo ""
            for instance in udp vless; do
              unit="vk-turn-proxy@${instance}.service"
              env_file="/etc/vk-turn-proxy/${instance}.env"
              if sudo systemctl is-active "$unit" >/dev/null 2>&1 && sudo test -r "$env_file"; then
                listen=$(sudo grep '^LISTEN=' "$env_file" | cut -d= -f2)
                connect=$(sudo grep '^CONNECT=' "$env_file" | cut -d= -f2)
                port="${listen##*:}"
                echo "- **${instance}**: \`${PUBLIC_IP}:${port}\` (proxies to \`${connect}\`)"
              fi
            done
            echo ""
            echo "captcha-service is deployed by the **Deploy captcha cluster** workflow now."
          } >> "$GITHUB_STEP_SUMMARY"
