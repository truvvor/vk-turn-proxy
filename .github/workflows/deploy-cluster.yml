name: Deploy captcha cluster

# Builds and rolls out captcha-service to every named runner in the
# cluster (us, ubuntu, ukoverheat). Each matrix cell is self-contained
# — build, install, configure, restart, healthcheck — so a runner that
# is offline / busy / has a stuck job doesn't block the rollout on the
# others. The previous two-phase design (install matrix → configure
# matrix that needs:install) made one offline runner park every other
# node's restart forever, because the configure phase's `needs: install`
# was waiting on the queued install job that nobody picked up.
#
# Auth: every node uses the SAME bearer token (repo secret
# CLUSTER_API_KEY). Generate one with `openssl rand -hex 32` and add it
# under Settings → Secrets and variables → Actions before running.
#
# Peer URLs: the cluster member IPs:port live in repo variable
# vars.CLUSTER_PEERS as a comma-separated list, e.g.
#   http://77.90.8.199:18080,http://67.217.246.160:18080,http://95.133.243.247:18080
# Each cell composes the PEERS env value by appending |${API_KEY} to
# every entry, and SELF_URL from its own detected public IP. If a
# runner's detected public IP isn't found in CLUSTER_PEERS the cell
# fails fast — that's a misconfig (probably a cloud-provider IP
# reallocation) rather than silently running with the wrong identity.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (defaults to the workflow's commit)
        required: false
        default: ''
      port:
        description: TCP port for captcha-service
        required: false
        default: '18080'
      warp:
        description: 'Provision Cloudflare WARP egress (registers a free WARP account via wgcf and brings up wg-quick@wgcf with Table=off; captcha-service then SO_BINDTODEVICEs every VK-bound socket to it)'
        required: false
        default: 'true'

concurrency:
  # Serialise cluster rolls; never tear down a roll mid-flight.
  group: deploy-cluster
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    # Run on a self-hosted runner — we don't depend on hosted Ubuntu
    # tooling here, and hosted minutes may be unavailable on this repo.
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Verify CLUSTER_API_KEY + CLUSTER_PEERS are set
        env:
          KEY: ${{ secrets.CLUSTER_API_KEY }}
          PEERS_VAR: ${{ vars.CLUSTER_PEERS }}
        run: |
          set -e
          if [ -z "${KEY}" ]; then
            echo "::error::Repo secret CLUSTER_API_KEY is empty. Generate one with"
            echo "::error::'openssl rand -hex 32' and add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Don't print the key. Just confirm length looks plausible.
          echo "CLUSTER_API_KEY present, length=${#KEY}"
          if [ -z "${PEERS_VAR}" ]; then
            echo "::error::Repo variable CLUSTER_PEERS is empty. Set it under"
            echo "::error::Settings → Secrets and variables → Actions → Variables to a"
            echo "::error::comma-separated list of peer URLs, e.g."
            echo "::error::  http://77.90.8.199:18080,http://67.217.246.160:18080,http://95.133.243.247:18080"
            exit 1
          fi
          echo "CLUSTER_PEERS=${PEERS_VAR}"

  deploy:
    name: Deploy on ${{ matrix.runner }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        runner: [ionos-us, ubuntu, ukoverheat]
    runs-on: [self-hosted, linux, x64, "${{ matrix.runner }}"]
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Ensure HOME / GOCACHE are set
        # Self-hosted runners that aren't started under a login shell
        # (e.g. systemd unit without `User=`/`PAMName=login`) arrive
        # here with an empty $HOME. actions/setup-go then can't compute
        # GOCACHE and the job dies with
        #   "GOCACHE is not defined and neither $XDG_CACHE_HOME nor $HOME are defined"
        # Fall back to RUNNER_TEMP which is always set.
        shell: bash
        run: |
          if [ -z "${HOME:-}" ]; then
            echo "HOME=$RUNNER_TEMP" >> "$GITHUB_ENV"
            echo "Set HOME=$RUNNER_TEMP (was unset on this runner)"
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.5'
          cache-dependency-path: captcha-service/go.sum

      - name: Build captcha-service binary
        working-directory: ./captcha-service
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags "-s -w" -trimpath \
            -o "$GITHUB_WORKSPACE/dist/captcha-service" .
          ls -la "$GITHUB_WORKSPACE/dist/captcha-service"

      - name: Install systemd unit + binary (idempotent)
        run: |
          set -e
          sudo install -d -m 0755 /opt/vk-turn-proxy
          sudo install -d -m 0750 /etc/vk-turn-proxy
          sudo install -m 0644 deploy/captcha-service.service /etc/systemd/system/captcha-service.service
          sudo install -m 0755 -o root -g root dist/captcha-service /opt/vk-turn-proxy/captcha-service.new
          sudo mv -f /opt/vk-turn-proxy/captcha-service.new /opt/vk-turn-proxy/captcha-service
          sudo systemctl daemon-reload

      - name: Install chrome-headless-shell (idempotent)
        # Required by captcha-service's headless BOT-fallback path
        # (HEADLESS_CAPTCHA=1, set in the env below). The install script
        # apt-installs Chromium's runtime libs and drops chrome-
        # headless-shell at /usr/local/bin/chrome-headless-shell. Skips
        # entirely if the binary is already present and runnable — re-
        # runs on a healthy node are a 1-second no-op.
        run: |
          set -e
          if [ -x /usr/local/bin/chrome-headless-shell ] \
              && /usr/local/bin/chrome-headless-shell --version >/dev/null 2>&1; then
            echo "chrome-headless-shell already installed: $(/usr/local/bin/chrome-headless-shell --version)"
            exit 0
          fi
          echo "Installing chrome-headless-shell on ${{ matrix.runner }}..."
          sudo bash scripts/install-chrome-headless-shell.sh

      - name: Provision Cloudflare WARP (idempotent)
        # Stand up a wg-quick@wgcf tunnel pinned to Cloudflare's WARP
        # edge so captcha-service can SO_BINDTODEVICE its VK-bound
        # sockets to a Cloudflare egress IP. See scripts/install-warp.sh
        # for the full story; it's idempotent and a no-op when wgcf is
        # already up. The "Compose env file" step downstream only sets
        # WARP_INTERFACE=wgcf when `wg show wgcf` actually works, so a
        # failed provision falls back to vanilla egress cleanly without
        # captcha-service crashing on a missing iface.
        if: inputs.warp == 'true'
        run: |
          set -e
          if sudo wg show wgcf >/dev/null 2>&1; then
            echo "wgcf already up on ${{ matrix.runner }}, skipping provision"
            sudo wg show wgcf | head -10
            exit 0
          fi
          echo "Provisioning Cloudflare WARP on ${{ matrix.runner }}..."
          sudo bash scripts/install-warp.sh

      - name: Compose env file and restart captcha-service
        env:
          API_KEY: ${{ secrets.CLUSTER_API_KEY }}
          PEERS_VAR: ${{ vars.CLUSTER_PEERS }}
          PORT: ${{ inputs.port }}
          MY_RUNNER: ${{ matrix.runner }}
        run: |
          set -e

          # Detect own public IP so SELF_URL matches the cluster's
          # external view (the entry the master uses to find us in its
          # peer table). Collect every public address this host could
          # legitimately answer on, not just whatever the echo service
          # happens to return.
          #
          # The `ubuntu` node is multi-homed (67.217.246.160 and
          # 198.71.56.216 — the pair in captcha-service/outbound.go's example
          # OUTBOUND_BIND_IPS). ipify answers with whichever egress the
          # request took, so a run can report the address that is NOT the one
          # in CLUSTER_PEERS and the SELF_URL check then fails on a node that
          # is configured perfectly well. That is exactly what happened on
          # 2026-08-11: ionos-us and ukoverheat deployed, ubuntu failed.
          #
          # So: gather ipify's answer AND every globally-routable IPv4 bound
          # to a local interface, then pick the one CLUSTER_PEERS knows about.
          CANDIDATE_IPS=""
          echo_ip=$(curl -fsS --max-time 5 https://api.ipify.org \
                 || curl -fsS --max-time 5 https://ifconfig.me \
                 || echo "")
          [ -n "$echo_ip" ] && CANDIDATE_IPS="$echo_ip"
          local_ips=$(ip -4 -o addr show scope global 2>/dev/null \
                      | awk '{print $4}' | cut -d/ -f1 \
                      | grep -vE '^(10\.|127\.|169\.254\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.)' \
                      || true)
          CANDIDATE_IPS="$CANDIDATE_IPS $local_ips"
          CANDIDATE_IPS=$(echo "$CANDIDATE_IPS" | tr ' ' '\n' | grep -v '^$' | sort -u)
          if [ -z "$CANDIDATE_IPS" ]; then
            echo "::error::Could not determine any public IP (echo services and local interfaces both came up empty)"
            exit 1
          fi
          echo "MY_RUNNER=${MY_RUNNER}, candidate IPs: $(echo $CANDIDATE_IPS | tr '\n' ' ')"

          MY_IP=""
          for cand in $CANDIDATE_IPS; do
            if echo "${PEERS_VAR}" | tr ',' '\n' | tr -d '[:space:]' \
               | grep -qx "http://${cand}:${PORT}"; then
              MY_IP="$cand"
              break
            fi
          done
          if [ -z "$MY_IP" ]; then
            # Keep the original diagnostic: none of our addresses is listed,
            # which is a real misconfiguration rather than a detection flake.
            MY_IP="${echo_ip:-$(echo $CANDIDATE_IPS | awk '{print $1}')}"
          fi
          SELF_URL="http://${MY_IP}:${PORT}"
          echo "MY_RUNNER=${MY_RUNNER}, MY_IP=${MY_IP}, SELF_URL=${SELF_URL}"

          # Build PEERS by appending |${API_KEY} to each URL listed in
          # vars.CLUSTER_PEERS. Validate SELF_URL is one of them — if
          # not, the cloud provider likely rotated this runner's IP
          # since CLUSTER_PEERS was last set, and we'd otherwise stand
          # up an orphan node that's invisible to peer-routing.
          PEERS=""
          self_in_peers=0
          IFS=',' read -ra PEER_URLS <<< "${PEERS_VAR}"
          for url in "${PEER_URLS[@]}"; do
            url=$(echo "$url" | tr -d '[:space:]')
            if [ -z "$url" ]; then continue; fi
            PEERS="${PEERS:+${PEERS},}${url}|${API_KEY}"
            if [ "$url" = "$SELF_URL" ]; then
              self_in_peers=1
            fi
          done

          if [ "$self_in_peers" -eq 0 ]; then
            echo "::error::SELF_URL=${SELF_URL} is not in vars.CLUSTER_PEERS=${PEERS_VAR}."
            echo "::error::Either this runner's public IP has changed (update CLUSTER_PEERS)"
            echo "::error::or PORT (${PORT}) doesn't match what's in CLUSTER_PEERS."
            exit 1
          fi

          # Only set WARP_INTERFACE if the previous "Provision
          # Cloudflare WARP" step actually brought wgcf up. Setting
          # it on a host with no wgcf iface would make every outbound
          # socket fail at SO_BINDTODEVICE EAFNOSUPPORT/ENODEV — much
          # worse than vanilla egress. `wg show wgcf` is the cheapest
          # liveness probe; an active interface returns its peer info,
          # a missing one returns rc=1.
          WARP_LINE=""
          if sudo wg show wgcf >/dev/null 2>&1; then
            WARP_LINE="WARP_INTERFACE=wgcf"
            echo "WARP detected — captcha-service will pin VK sockets to wgcf"
          else
            echo "WARP iface wgcf not present — captcha-service will use default egress"
          fi

          # Write the env file via a temp + mv so an in-flight read on
          # the running unit doesn't see a half-written file.
          # HEADLESS_CAPTCHA=1 + CHROMIUM_PATH activate the chrome-
          # headless-shell BOT-fallback path that the previous step
          # provisioned. captcha-service main.go reads both at startup.
          tmp=$(mktemp)
          cat > "$tmp" <<EOF
          LISTEN_ADDR=:${PORT}
          API_KEY=${API_KEY}
          PEERS=${PEERS}
          SELF_URL=${SELF_URL}
          HEADLESS_CAPTCHA=1
          CHROMIUM_PATH=/usr/local/bin/chrome-headless-shell
          ${WARP_LINE}
          EOF
          sudo install -m 0640 -o root -g root "$tmp" /etc/vk-turn-proxy/captcha-service.env
          rm -f "$tmp"

          sudo systemctl enable captcha-service.service
          sudo systemctl restart captcha-service.service
          sleep 2
          sudo systemctl is-active captcha-service.service

      - name: Healthcheck
        id: health
        run: |
          set -e
          PORT="${{ inputs.port }}"
          # Self-healthz via localhost (avoids needing the firewall open
          # for the inbound check to succeed during the workflow itself).
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 3 "http://127.0.0.1:${PORT}/healthz" | grep -q '^ok$'; then
              echo "healthz ok"
              exit 0
            fi
            echo "healthz attempt $i failed, retrying..."
            sleep 1
          done
          echo "::error::healthz did not return 'ok' after 5 tries"
          sudo journalctl -u captcha-service.service -n 40 --no-pager
          exit 1

      - name: Summary
        if: success()
        env:
          PORT: ${{ inputs.port }}
          MY_RUNNER: ${{ matrix.runner }}
        run: |
          MY_IP=$(curl -fsS --max-time 3 https://api.ipify.org 2>/dev/null || echo "<ip>")
          {
            echo "### ${MY_RUNNER} (\`${MY_IP}:${PORT}\`)"
            echo ""
            sudo systemctl --no-pager --lines=10 status captcha-service.service | head -15
            echo ""
            echo "Stats snapshot:"
            echo '```json'
            curl -fsS --max-time 3 "http://127.0.0.1:${PORT}/stats"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  post:
    name: Cluster summary
    needs: deploy
    runs-on: [self-hosted, linux, x64]
    if: always()
    steps:
      - name: Print cluster overview
        env:
          PORT: ${{ inputs.port }}
          PEERS_VAR: ${{ vars.CLUSTER_PEERS }}
        run: |
          {
            echo "## Cluster"
            echo ""
            echo "Configured peers (from \`vars.CLUSTER_PEERS\`):"
            echo ""
            IFS=',' read -ra PEER_URLS <<< "${PEERS_VAR}"
            for url in "${PEER_URLS[@]}"; do
              url=$(echo "$url" | tr -d '[:space:]')
              [ -n "$url" ] && echo "- \`${url}\`"
            done
            echo ""
            echo "iOS client points to **any one** of these URLs (the entry-point"
            echo "node acts as master for that request and round-robins among all"
            echo "peers transparently)."
            echo ""
            echo "API key: still the value of the \`CLUSTER_API_KEY\` repo secret."
            echo "Don't forget to open TCP/${PORT} in the cloud firewall on every node."
          } >> "$GITHUB_STEP_SUMMARY"
